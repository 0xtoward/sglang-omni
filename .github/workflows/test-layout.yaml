name: Black scope verdict checks
on: workflow_dispatch
permissions:
  contents: read
jobs:
  cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pre-commit PyYAML
      - name: Compare full and scoped verdicts
        run: python .github/black-trial/edges.py

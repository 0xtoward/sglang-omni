name: Compare file partition before and after pytest collection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    name: ${{ matrix.order }} / shard ${{ matrix.partition }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        order: [late-early, early-late]
        partition: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      CUDA_VISIBLE_DEVICES: ""
      UV_TORCH_BACKEND: cpu
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      SGLANG_OMNI_TORCH_COMPILE_DEFAULT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Install CPU test dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg sox
          uv venv --python 3.12
          python3 -c 'import tomllib; print("\n".join(tomllib.load(open("pyproject.toml", "rb"))["tool"]["uv"]["override-dependencies"]))' > "$RUNNER_TEMP/omni-overrides.txt"
          uv pip install --overrides "$RUNNER_TEMP/omni-overrides.txt" --find-links https://abetlen.github.io/llama-cpp-python/whl/cpu/llama-cpp-python/ \
            -e '.[audar-tts,fishaudio,fun-cosyvoice3,minicpm-o]'
          uv pip install --no-deps qwen-tts==0.1.1
          bash .github/scripts/install_ci_cosyvoice.sh .venv

      - name: Compare collection and full execution
        env:
          PART: ${{ matrix.partition }}
          ORDER: ${{ matrix.order }}
        run: |
          source .venv/bin/activate
          export PYTHONPATH="$PWD"
          python .github/early-collect/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.order }}-part-${{ matrix.partition }}
          path: |
            ${{ runner.temp }}/evidence/*/*.json
            ${{ runner.temp }}/evidence/*/*.xml
            ${{ runner.temp }}/evidence/*/pytest.log

name: Hosted CPU unit tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    name: unit-test-cpu-${{ matrix.partition }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1]
    env:
      CUDA_VISIBLE_DEVICES: ""
      UV_TORCH_BACKEND: cpu
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      SGLANG_OMNI_TORCH_COMPILE_DEFAULT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Install CPU test dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg sox
          uv venv --python 3.12
          python3 -c 'import tomllib; print("\n".join(tomllib.load(open("pyproject.toml", "rb"))["tool"]["uv"]["override-dependencies"]))' > "$RUNNER_TEMP/omni-overrides.txt"
          uv pip install --overrides "$RUNNER_TEMP/omni-overrides.txt" --find-links https://abetlen.github.io/llama-cpp-python/whl/cpu/llama-cpp-python/ \
            -e '.[audar-tts,fishaudio,fun-cosyvoice3,minicpm-o]'
          uv pip install --no-deps qwen-tts==0.1.1
          bash .github/scripts/install_ci_cosyvoice.sh .venv

      - name: Check the accelerator selection
        run: |
          .venv/bin/python -m pytest tests/unit_test/vendor/test_sglang_flashattention_backend_patch.py --collect-only -q -m accelerator
      - name: Check streaming feature parity
        env:
          MKL_ENABLE_INSTRUCTIONS: ${{ matrix.partition == 0 && 'AVX2' || 'AVX512' }}
        run: |
          source .venv/bin/activate
          for trial in 1 2 3; do
            python -m pytest -q tests/unit_test/minicpm_o/test_streaming_perception.py::test_batched_perception_matches_each_session_alone[whole_buffer] \
              tests/unit_test/nemotron_diarization/test_streaming.py::test_incremental_features_match_complete_audio_and_flush_partial_tail || exit 1
          done

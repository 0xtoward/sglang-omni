name: Lint

# Runs on every pull request without CI labels, and is a required check on
# main. The self-hosted CI gates (.github/scripts/pr_ci_gate.py) wait for the
# lint job on the same commit, so keep this workflow fast. Pushes to main only
# refresh the pre-commit cache that pull requests read.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install pre-commit

      # note (chenyang): no-commit-to-branch fails on main by design, so a
      # push only builds the hook environments for the cache.
      - name: Warm pre-commit cache
        if: ${{ github.event_name == 'push' }}
        run: pre-commit install-hooks

      - name: Identify the Black environment
        id: environment
        run: |
          python - <<'PYTHON'
          import os
          from importlib.metadata import version
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"tools={version('pre-commit')}-{version('identify')}", file=out)
          PYTHON

      - name: Check Black on the default branch
        if: github.event_name == 'push'
        run: pre-commit run black-jupyter --all-files --show-diff-on-failure

      - name: Record clean Black baseline
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: .pre-commit-config.yaml
          key: black-clean-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ steps.environment.outputs.tools }}-${{ github.sha }}

      - name: Look up the base commit's full Black result
        if: github.event_name == 'pull_request'
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: .pre-commit-config.yaml
          key: black-clean-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ steps.environment.outputs.tools }}-${{ github.event.pull_request.base.sha }}
          lookup-only: true

      - name: Linting
        if: github.event_name != 'push'
        env:
          CLEAN_BASE: ${{ steps.baseline.outputs.cache-hit == 'true' && github.event.pull_request.base.sha || '' }}
        run: bash .github/scripts/lint_with_scoped_black.sh "$CLEAN_BASE"
